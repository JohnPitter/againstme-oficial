name: Feature Request
description: Sugira uma nova feature ou melhoria
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Qual é a ideia?
      description: Descreva a feature em uma ou duas frases
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Que problema isso resolve?
      description: Por que isso seria útil pra você ou pra outros jogadores?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
      description: Existe outro jeito de resolver o mesmo problema?
  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
